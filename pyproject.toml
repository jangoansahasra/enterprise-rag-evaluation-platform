[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-evaluation-platform"
version = "0.1.0"
description = "Evidence-grounded reliability evaluation for enterprise RAG systems"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu==1.15.0",
    "langgraph==1.2.11",
    "numpy>=2.0,<3",
    "sentence-transformers==6.0.1",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "streamlit==1.64.0",
    "mlflow>=3.0,<4",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rag-eval = "rag_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
