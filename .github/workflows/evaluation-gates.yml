name: Evaluation gates

on:
  pull_request:
    paths:
      - "data/**"
      - "config/quality-gates.json"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/evaluation-gates.yml"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "config/quality-gates.json"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/evaluation-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-evaluation:
    name: Deterministic evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Validate source and benchmark data
        run: python scripts/validate_data.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Apply deterministic quality gates
        run: python scripts/check_quality_gates.py